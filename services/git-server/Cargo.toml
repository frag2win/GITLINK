[package]
name = "git-server"
version = "0.1.0"
edition = "2021"
description = "Local-first P2P Git hosting platform - Git operations service"
authors = ["Shubham"]

[dependencies]
# Git operations via libgit2 bindings
git2 = "0.18"

# Async runtime with full features (fs, net, io, time, macros)
tokio = { version = "1", features = ["full"] }

# Serialization / deserialization with derive macros
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Flexible error handling
anyhow = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Protobuf support
prost = "0.12"
bytes = "1.5"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tempfile = "3.27.0"
