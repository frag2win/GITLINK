syntax = "proto3";

package git_commands;

option go_package = "github.com/localrepo/api-server/proto/generated;pb";

// ---------------------------------------------------------------------------
// Request/Response Envelopes
// ---------------------------------------------------------------------------

message GitError {
  string code = 1;
  string message = 2;
}

message GitCommandRequest {
  int32 protocol_version = 1; // Used for forward compatibility

  oneof command {
    CreateRepoRequest create_repo = 2;
    DeleteRepoRequest delete_repo = 3;
    ListReposRequest list_repos = 4;
    PushRequest push = 5;
    PullRequest pull = 6;
    ListCommitsRequest list_commits = 7;
    GetCommitRequest get_commit = 8;
    GetDiffRequest get_diff = 9;
    GetFileRequest get_file = 10;
    GetTreeRequest get_tree = 11;
    InfoRefsRequest info_refs = 12;
    UploadPackRequest upload_pack = 13;
    ReceivePackRequest receive_pack = 14;
    MergePullRequest merge_pull_request = 15;
    CreateBranchRequest create_branch = 16;
    DeleteBranchRequest delete_branch = 17;
    ListBranchesRequest list_branches = 18;
    GetBranchRequest get_branch = 19;
    CreateTagRequest create_tag = 20;
    DeleteTagRequest delete_tag = 21;
    ListTagsRequest list_tags = 22;
  }
}

message GitCommandResponse {
  int32 protocol_version = 1;
  GitError error = 2; // Populated if the operation failed

  oneof result {
    CreateRepoResponse create_repo = 3;
    DeleteRepoResponse delete_repo = 4;
    ListReposResponse list_repos = 5;
    PushResponse push = 6;
    PullResponse pull = 7;
    ListCommitsResponse list_commits = 8;
    GetCommitResponse get_commit = 9;
    GetDiffResponse get_diff = 10;
    GetFileResponse get_file = 11;
    GetTreeResponse get_tree = 12;
    InfoRefsResponse info_refs = 13;
    UploadPackResponse upload_pack = 14;
    ReceivePackResponse receive_pack = 15;
    MergePullRequestResponse merge_pull_request = 16;
    CreateBranchResponse create_branch = 17;
    DeleteBranchResponse delete_branch = 18;
    ListBranchesResponse list_branches = 19;
    GetBranchResponse get_branch = 20;
    CreateTagResponse create_tag = 21;
    DeleteTagResponse delete_tag = 22;
    ListTagsResponse list_tags = 23;
  }
}

// ---------------------------------------------------------------------------
// Repo Management
// ---------------------------------------------------------------------------

message RepoInfo {
  string name = 1;
  string path = 2;
  bool is_bare = 3;
  string default_branch = 4;
  string last_commit_at = 5;
  int32 branch_count = 6;
  int32 tag_count = 7;
}

message CreateRepoRequest {
  string name = 1;
}

message CreateRepoResponse {
  RepoInfo repo = 1;
}

message DeleteRepoRequest {
  string name = 1;
}

message DeleteRepoResponse {}

message ListReposRequest {}

message ListReposResponse {
  repeated RepoInfo repos = 1;
}

// ---------------------------------------------------------------------------
// Push & Pull Operations
// ---------------------------------------------------------------------------

message PushRequest {
  string repo_name = 1;
  bytes pack_data = 2;
}

message PushResponse {
  string new_head = 1;
}

message PullRequest {
  string repo_name = 1;
}

message PullResponse {
  bytes pack_data = 1;
}

// ---------------------------------------------------------------------------
// Commit History & Diffs
// ---------------------------------------------------------------------------

message CommitInfo {
  string hash = 1;
  string author_name = 2;
  string author_email = 3;
  string message = 4;
  string timestamp = 5; // ISO-8601 string
  repeated string parent_hashes = 6;
}

message ListCommitsRequest {
  string repo_name = 1;
  string branch = 2; // defaults to default_branch
  int32 limit = 3;
  int32 offset = 4;
}

message ListCommitsResponse {
  repeated CommitInfo commits = 1;
  int32 total_count = 2;
}

message GetCommitRequest {
  string repo_name = 1;
  string hash = 2;
}

message GetCommitResponse {
  CommitInfo commit = 1;
}

message GetDiffRequest {
  string repo_name = 1;
  string base_hash = 2; // empty means compare to parent
  string target_hash = 3;
}

message GetDiffResponse {
  string diff_text = 1;
}

// ---------------------------------------------------------------------------
// File Browser (Objects & Trees)
// ---------------------------------------------------------------------------

message TreeEntry {
  string name = 1;
  string path = 2;
  string type = 3; // "blob" or "tree"
  string oid = 4;
  int64 size = 5; // size in bytes for blobs, 0 for trees
}

message GetTreeRequest {
  string repo_name = 1;
  string ref_or_hash = 2; // e.g. "main" or a specific commit hash
  string path = 3; // path within the repository
}

message GetTreeResponse {
  repeated TreeEntry entries = 1;
}

message GetFileRequest {
  string repo_name = 1;
  string ref_or_hash = 2;
  string path = 3;
}

message GetFileResponse {
  bytes content = 1;
  int64 size = 2;
  bool is_binary = 3;
}

// ---------------------------------------------------------------------------
// Git Smart HTTP Bridge
// ---------------------------------------------------------------------------

message InfoRefsRequest {
  string repo_name = 1;
  string service = 2;
}

message InfoRefsResponse {
  bytes output = 1;
}

message UploadPackRequest {
  string repo_name = 1;
  bytes body = 2;
}

message UploadPackResponse {
  bytes output = 1;
}

message ReceivePackRequest {
  string repo_name = 1;
  bytes body = 2;
}

message ReceivePackResponse {
  bytes output = 1;
}

// ---------------------------------------------------------------------------
// Pull Requests
// ---------------------------------------------------------------------------

message MergePullRequest {
  string repo_name = 1;
  string base_branch = 2;
  string head_branch = 3;
  string author_name = 4;
  string author_email = 5;
  string commit_message = 6;
}

message MergeConflict {
  string path = 1;
  string conflict_type = 2;
  string base_oid = 3;
  string ours_oid = 4;
  string theirs_oid = 5;
  bool is_binary = 6;
}

message MergeConflictList {
  repeated MergeConflict conflicts = 1;
}

message MergePullRequestResponse {
  oneof outcome {
    string merge_commit_hash = 1;
    MergeConflictList conflicts = 2;
  }
}

// ---------------------------------------------------------------------------
// Branches & Tags
// ---------------------------------------------------------------------------

message BranchInfo {
  string name = 1;
  bool is_head = 2;
  string commit_id = 3;
  string commit_summary = 4;
  string committed_at = 5;
}

message CreateBranchRequest {
  string repo_name = 1;
  string branch_name = 2;
  string target_commit_id = 3;
}

message CreateBranchResponse {
  BranchInfo branch = 1;
}

message DeleteBranchRequest {
  string repo_name = 1;
  string branch_name = 2;
}

message DeleteBranchResponse {}

message ListBranchesRequest {
  string repo_name = 1;
}

message ListBranchesResponse {
  repeated BranchInfo branches = 1;
}

message GetBranchRequest {
  string repo_name = 1;
  string branch_name = 2;
}

message GetBranchResponse {
  BranchInfo branch = 1;
}

message TagInfo {
  string name = 1;
  string target_id = 2;
  bool is_annotated = 3;
  string message = 4;
  string tagger_name = 5;
  string tagged_at = 6;
}

message CreateTagRequest {
  string repo_name = 1;
  string tag_name = 2;
  string target_commit_id = 3;
  string message = 4;
  string tagger_name = 5;
  string tagger_email = 6;
}

message CreateTagResponse {
  TagInfo tag = 1;
}

message DeleteTagRequest {
  string repo_name = 1;
  string tag_name = 2;
}

message DeleteTagResponse {}

message ListTagsRequest {
  string repo_name = 1;
}

message ListTagsResponse {
  repeated TagInfo tags = 1;
}
