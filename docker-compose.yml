# =============================================================================
# Docker Compose — Local-First P2P Git Hosting Platform
# =============================================================================
# Three-container architecture communicating via Unix domain sockets:
#   1. libp2p-node  — Go libp2p networking daemon (host network for peer discovery)
#   2. git-server   — Rust git backend (network: none for security isolation)
#   3. api-server   — Go + Fiber HTTP API (internal bridge network only)
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # init-permissions — Fix volume permissions for non-root containers
  # ---------------------------------------------------------------------------
  init-permissions:
    image: busybox
    volumes:
      - git-socket:/run/git
      - p2p-socket:/run/p2p
    command: sh -c "chown -R 1002:1002 /run/git && chown -R 1001:1001 /run/p2p"

  # ---------------------------------------------------------------------------
  # libp2p-node — Peer-to-peer networking daemon
  # ---------------------------------------------------------------------------
  # Runs on the host network so it can participate in mDNS peer discovery and
  # accept inbound libp2p connections without NAT issues. Communicates with
  # api-server and git-server exclusively through Unix domain sockets.
  # ---------------------------------------------------------------------------
  libp2p-node:
    build:
      context: ./services/libp2p-node
      dockerfile: Dockerfile
    container_name: p2p-git-libp2p
    network_mode: host
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PEER_KEY_PATH=/identity/peer.key
      - P2P_LISTEN_PORT=${P2P_LISTEN_PORT:-4001}
      - MDNS_ENABLED=${MDNS_ENABLED:-true}
    volumes:
      - peer-identity:/identity:ro
      - p2p-socket:/run/p2p
      - git-socket:/run/git
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/p2p/libp2p.sock"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # git-server — Rust-based git backend
  # ---------------------------------------------------------------------------
  # Completely isolated from the network (network: none). It can ONLY be
  # reached through the Unix domain socket shared via the git-socket volume.
  # This is the core security boundary — even if the API is compromised, the
  # git data cannot be exfiltrated over the network directly.
  # ---------------------------------------------------------------------------
  git-server:
    build:
      context: .
      dockerfile: ./services/git-server/Dockerfile
    container_name: p2p-git-server
    network_mode: "none"
    restart: unless-stopped
    environment:
      - GIT_SERVER_LOG_LEVEL=${LOG_LEVEL:-info}
      - GIT_SERVER_REPOS_PATH=/repos
      - GIT_SERVER_SOCKET_PATH=/run/git/git.sock
    volumes:
      - git-socket:/run/git
      - ${HOST_REPOS_PATH:-./data/repos}:/repos
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/git/git.sock"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # api-server — Go + Fiber HTTP API
  # ---------------------------------------------------------------------------
  # Connected to the internal bridge network only. Serves the REST/WebSocket
  # API to the local web UI. Communicates with libp2p-node and git-server
  # through their respective Unix domain sockets — never over TCP.
  # ---------------------------------------------------------------------------
  api-server:
    build:
      context: ./services/api-server
      dockerfile: Dockerfile
    container_name: p2p-git-api
    networks:
      - internal-bridge
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      - API_LOG_LEVEL=${LOG_LEVEL:-info}
      - API_PORT=3000
      - API_GIT_SOCKET=/run/git/git.sock
      - API_P2P_SOCKET=/run/p2p/libp2p.sock
      - API_DB_URL=postgres://gitadmin:gitpassword@postgres:5432/gitplatform?sslmode=disable
      - API_DB_PATH=/data/api.db
      - API_REPOS_PATH=/repos
    volumes:
      - p2p-socket:/run/p2p
      - git-socket:/run/git
      - ${HOST_DB_PATH:-./data/db}:/data
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      libp2p-node:
        condition: service_started
      git-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # postgres — Relational DB for platform data (Users, PRs, Branch Protection)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: p2p-git-postgres
    networks:
      - internal-bridge
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitadmin
      POSTGRES_PASSWORD: gitpassword
      POSTGRES_DB: gitplatform
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitadmin -d gitplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

# =============================================================================
# Volumes — Shared Unix domain socket channels & persistent identity
# =============================================================================
volumes:
  # Stores the libp2p peer identity key (ed25519). Persisted across restarts
  # so the node keeps its PeerID.
  peer-identity:
    driver: local

  # Unix domain socket for git-server ↔ api-server / libp2p-node IPC
  git-socket:
    driver: local

  # Unix domain socket for libp2p-node ↔ api-server IPC
  p2p-socket:
    driver: local

  # PostgreSQL database persistence
  pg-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal bridge network — only the api-server is attached. Provides the
  # port-mapped HTTP endpoint while keeping libp2p-node and git-server off
  # any Docker-managed network.
  internal-bridge:
    driver: bridge
    internal: false
